# Dev layer, auto-loaded by `docker compose up` alongside compose.yaml.
# Bind mounts give live editing of the sources; vendor/ and node_modules/
# stay in named volumes. After dependency changes, refresh them:
#   docker compose run --rm app composer install
#   docker compose run --rm node npm ci
services:
  app:
    ports:
      - "8081:80"
    volumes:
      - ./backend:/app
      - app_vendor:/app/vendor

  node:
    image: node:24-alpine
    # Tooling executor: used through `docker compose run`, never `up`.
    profiles: ["tools"]
    working_dir: /app
    environment:
      # Vite's dev proxy target as seen from inside the compose network.
      API_PROXY_TARGET: http://app:80
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  app_vendor:
  frontend_node_modules:
