server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # The API answers on the same origin; the Symfony app owns every /api route.
    location /api/ {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The SPA routes by URL hash; every path falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
