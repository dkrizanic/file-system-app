# Throwaway PostgreSQL for the PHPUnit suite (AGENTS.md §6 fallback, D14).
# Always combined with compose.yaml so db-test joins the app's network:
#   docker compose -f compose.yaml -f compose.test.yaml --profile test up -d --wait db-test
services:
  db-test:
    image: postgres:18
    profiles:
      - test
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - "5433:5432"
    # tmpfs keeps the data throwaway: everything dies with the container,
    # so every test run starts from the migration-seeded state.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test"]
      interval: 5s
      timeout: 5s
      retries: 10
